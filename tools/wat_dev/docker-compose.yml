# Dev container for a StarPilot checkout. Run from this folder on the Unraid host:
#   cp .env.example .env   # then fill it in
#   docker compose up -d --build
services:
  dev:
    image: starpilot-dev
    build:
      context: ../..                    # repo root
      dockerfile: Dockerfile.wat_dev
    container_name: starpilot-dev
    restart: unless-stopped
    hostname: starpilot-dev
    working_dir: ${DEV_ROOT}            # where `docker exec` lands
    shm_size: 4g
    cap_add: [SYS_PTRACE]               # gdb
    security_opt: ["seccomp=unconfined"]
    environment:
      AUTHORIZED_KEY: "${AUTHORIZED_KEY:?set AUTHORIZED_KEY in .env}"
      VNC_PASSWORD: "${VNC_PASSWORD:?set VNC_PASSWORD in .env}"
      # Everything lives under one mount (DEV_ROOT) so uv can hardlink from its
      # cache into each clone's .venv (hardlinks fail across separate mounts).
      DEV_ROOT: "${DEV_ROOT:?set DEV_ROOT in .env}"
      REPOS_DIR: "${DEV_ROOT}/workspace"
      CCACHE_DIR: "${DEV_ROOT}/ccache"
      UV_CACHE_DIR: "${DEV_ROOT}/uv_cache"
      # Device-build sysroot and caches (AGNOS image, scons), shared by all clones.
      # Same path inside and outside, since ./build passes them to the host's Docker.
      COMMA_SYSROOT_DIR: "${DEV_ROOT}/sysroot"
      COMMA_HOST_SYSROOT_DIR: "${DEV_ROOT}/sysroot"
      COMMA_HOST_CACHE_DIR: "${DEV_ROOT}/build_cache"
    networks: [containernet]
    labels:
      # Traefik TCP passthrough for native VNC (needs a `vnc` entrypoint on :5900 in Traefik)
      - traefik.tcp.routers.starpilot-vnc.rule=HostSNI(`*`)
      - traefik.tcp.routers.starpilot-vnc.entrypoints=vnc
      - traefik.tcp.routers.starpilot-vnc.service=starpilot-vnc
      - traefik.tcp.services.starpilot-vnc.loadbalancer.server.port=5900
      # Same for ssh (needs an `ssh` entrypoint in Traefik)
      - traefik.tcp.routers.starpilot-ssh.rule=HostSNI(`*`)
      - traefik.tcp.routers.starpilot-ssh.entrypoints=ssh
      - traefik.tcp.routers.starpilot-ssh.service=starpilot-ssh
      - traefik.tcp.services.starpilot-ssh.loadbalancer.server.port=22
      # noVNC desktop over HTTP (websocket upgrade is handled by Traefik)
      - traefik.http.routers.starpilot-novnc.rule=Host(`starpilot-dev.docker.lan`)
      - traefik.http.routers.starpilot-novnc.entrypoints=http
      - traefik.http.routers.starpilot-novnc.service=starpilot-novnc
      - traefik.http.services.starpilot-novnc.loadbalancer.server.port=6080
      # Galaxy dev server (plain HTTP + SSE, no websockets)
      - traefik.http.routers.starpilot-galaxy.rule=Host(`starpilot-galaxy.docker.lan`)
      - traefik.http.routers.starpilot-galaxy.entrypoints=http
      - traefik.http.routers.starpilot-galaxy.service=starpilot-galaxy
      - traefik.http.services.starpilot-galaxy.loadbalancer.server.port=8083
    # No published ports: Traefik is the only entrypoint (ssh 2222, VNC 5900,
    # noVNC on http) and reaches the container over containernet.
    volumes:
      # Mounted at the SAME path as on the host, so ./build (which starts
      # containers through the host's Docker) sees real host paths and needs
      # no COMMA_HOST_ROOT_DIR override. Put your clones under DEV_ROOT/workspace.
      # Use a direct pool path (/mnt/<pool>/...), not /mnt/user: FUSE shares
      # don't support hardlinks reliably.
      - ${DEV_ROOT}:${DEV_ROOT}
      # Home and /tmp on the same pool as the repos, not in Docker's image store
      # (the smaller, fuller cache pool). Home is seeded from the image on start.
      - ${DEV_ROOT}/home:/home/batman
      - ${DEV_ROOT}/tmp:/tmp
      - sshkeys:/etc/ssh/keys
      - /var/run/docker.sock:/var/run/docker.sock   # device builds; gives the container control of the host's Docker
    # Optional GPU for a rendered sim (needs the Nvidia driver plugin):
    # runtime: nvidia
    # environment: [NVIDIA_VISIBLE_DEVICES=all]

networks:
  containernet:
    external: true      # existing bridge on the Unraid host

volumes:
  sshkeys:
