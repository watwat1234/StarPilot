# Place at .forgejo/workflows/base-image.yml in the StarPilot fork.
# Builds Dockerfile.openpilot_base and pushes it to the Forgejo container registry.
#
# Requirements:
#   - Actions enabled on the repo, and a runner with Docker access (label below)
#   - Repo secret REGISTRY_TOKEN: a Forgejo access token with write:package
#     (Settings > Applications), owned by the user named in REGISTRY_USER
name: base-image

on:
  workflow_dispatch:
  push:
    branches: [main]   # change to your default branch
    paths:
      - Dockerfile.openpilot_base
      - pyproject.toml
      - uv.lock
      - tools/install_ubuntu_dependencies.sh
      - tools/install_python_dependencies.sh
      - .forgejo/workflows/base-image.yml

jobs:
  build:
    runs-on: unraid-runner   # must match a label on your runner
    env:
      REGISTRY_USER: waffle
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false   # the base image build doesn't need LFS objects

      - name: Compute image name
        run: |
          host="${GITHUB_SERVER_URL#*://}"
          owner="$(echo "${REGISTRY_USER}" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=${host}/${owner}/starpilot-base" >> "$GITHUB_ENV"

      - name: Build
        run: |
          docker build -f Dockerfile.openpilot_base \
            -t "$IMAGE:latest" -t "$IMAGE:${GITHUB_SHA::8}" .

      - name: Push
        env:
          TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: |
          echo "$TOKEN" | docker login "${IMAGE%%/*}" -u "$REGISTRY_USER" --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${GITHUB_SHA::8}"