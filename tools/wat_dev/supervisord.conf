[supervisord]
nodaemon=true
user=root

[program:sshd]
command=/usr/sbin/sshd -D -e
autorestart=true

[program:xvfb]
command=Xvfb :1 -screen 0 1920x1080x24
user=%(ENV_DEV_USER)s
autorestart=true
priority=10

[program:fluxbox]
command=fluxbox
environment=DISPLAY=":1"
user=%(ENV_DEV_USER)s
autorestart=true
priority=20

[program:x11vnc]
command=x11vnc -display :1 -forever -shared -nopw -rfbport 5900 -localhost
user=%(ENV_DEV_USER)s
autorestart=true
priority=30

[program:novnc]
command=websockify --web /usr/share/novnc 6080 localhost:5900
user=%(ENV_DEV_USER)s
autorestart=true
priority=40

[program:code-server]
command=code-server --bind-addr 0.0.0.0:8443 /workspace
environment=HOME="/home/%(ENV_DEV_USER)s"
user=%(ENV_DEV_USER)s
autorestart=true
